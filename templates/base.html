<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإنذار المبكر - كاراموجا</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); min-height: 100vh; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: none; }
        .card-header { background: rgba(0,0,0,0.8); color: white; border-radius: 15px 15px 0 0 !important; }
        .navbar { background: rgba(0,0,0,0.9) !important; }
        .risk-red { background: #e74c3c; color: white; }
        .risk-orange { background: #e67e22; color: white; }
        .risk-yellow { background: #f1c40f; color: black; }
        .risk-green { background: #27ae60; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🌍 نظام الإنذار المبكر</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/">🏠 الرئيسية</a>
                <a class="nav-link" href="/add_village">➕ إضافة قرية</a>
                <a class="nav-link" href="/distribute">📦 توزيع</a>
                <a class="nav-link" href="/distributions">📋 السجل</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
